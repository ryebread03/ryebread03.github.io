<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by ryebread03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{ --ink:#232A24; --ink-soft:#4A5349; --ink-faint:#8B948A; --paper:#F4F5F1; --card:#FFFFFF;
    --line:#DDE2D8; --accent:#2F5D50; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#E8ECE6; --ink-soft:#B9C1B7; --ink-faint:#7F887E; --paper:#151916; --card:#1E2420;
      --line:#2E3630; --accent:#8CC4A8; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.6 'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  main{ max-width:720px; margin:0 auto; padding:48px 16px 64px; }
  h1{ font-size:28px; font-weight:600; margin:0 0 4px; }
  .lede{ color:var(--ink-soft); margin:0 0 32px; }
  .apps{ list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .app{ display:flex; gap:16px; align-items:flex-start; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:16px 20px; }
  .app img{ width:44px; height:44px; flex-shrink:0; border-radius:10px; }
  .app h2{ font-size:18px; font-weight:600; margin:0; }
  .app h2 a{ color:var(--ink); text-decoration:none; }
  .app h2 a:hover{ color:var(--accent); }
  .app p{ margin:2px 0 8px; color:var(--ink-soft); }
  .links{ display:flex; gap:16px; flex-wrap:wrap; font-size:14px; }
  .links a{ color:var(--accent); text-underline-offset:2px; }
  footer{ margin-top:40px; font-size:13px; color:var(--ink-faint); }
  footer a{ color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <p class="lede">Small apps made by ryebread03. Each one has its own page, privacy policy and terms.</p>

  <ul class="apps">
    <!-- To add an app, copy one <li class="app"> block and change its links. -->
    <li class="app">
      <img src="Trellis/icon.png" alt="">
      <div>
        <h2><a href="Trellis/">Trellis</a></h2>
        <p>A personal project manager that lays out tasks as a dependency tree instead of a timeline.</p>
        <div class="links">
          <a href="Trellis/">Home</a>
          <a href="Trellis/privacy.html">Privacy</a>
          <a href="Trellis/terms.html">Terms</a>
        </div>
      </div>
    </li>
  </ul>

  <footer>Contact: <a href="mailto:ryandcollier17@gmail.com">ryandcollier17@gmail.com</a></footer>
</main>
</body>
</html>
